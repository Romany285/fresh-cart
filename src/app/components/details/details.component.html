 
<section
  class="product-details w-75 mx-auto my-3 shadow rounded p-3"
  *ngIf="productDetails"
>
  <div class="row align-items-center">

    <!-- Product Images -->
    <div class="col-12 col-md-4 mb-4 mb-md-0">

      <owl-carousel-o [options]="detailsOptions">

        <ng-container *ngFor="let item of productDetails.images">

          <ng-template carouselSlide>

            <img
              [src]="item"
              [alt]="productDetails.title"
              class="w-100 product-details-image"
            />

          </ng-template>

        </ng-container>

      </owl-carousel-o>

    </div>


    <!-- Product Details -->
    <div class="col-12 col-md-8">

      <h3 class="h5">
        {{ productDetails.title }}
      </h3>

      <p class="h6 font-md text-muted product-description">
        {{ productDetails.description }}
      </p>

      <h4 class="h6 pt-2">
        {{ productDetails.category.name }}
      </h4>


      <div
        class="d-flex justify-content-between align-items-center my-3"
      >

        <span class="text-main">
          {{ productDetails.price | currency }}
        </span>

        <p class="mb-0">
          <i class="rading-color fas fa-star"></i>
          {{ productDetails.ratingsAverage }}
        </p>

      </div>


      <button
        #element
        (click)="addProduct(productDetails._id, element)"
        class="main-btn w-100 my-3"
      >
        + Add To Cart
      </button>

    </div>

  </div>
</section>
