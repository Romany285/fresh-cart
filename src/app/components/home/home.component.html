 
<!-- Main Slider -->
<section class="main-slider-section pb-3">
  <div class="container-fluid mt-4">
    <owl-carousel-o [options]="mainOptions">
      <ng-template carouselSlide>
        <img
          src="./assets/images/main-slider-1.jpeg"
          alt="slide-1"
          class="w-100 rounded-5 main-slider-img"
        />
      </ng-template>

      <ng-template carouselSlide>
        <img
          src="./assets/images/main-slider-2.jpeg"
          alt="slide-2"
          class="w-100 rounded-5 main-slider-img"
        />
      </ng-template>

      <ng-template carouselSlide>
        <img
          src="./assets/images/main-slider-3.jpeg"
          alt="slide-3"
          class="w-100 rounded-5 main-slider-img"
        />
      </ng-template>
    </owl-carousel-o>
  </div>
</section>


<!-- Categories -->
<section class="categories-section py-3 px-3" *ngIf="categories.length > 0">

  <div class="categories-header d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Shop Categories</h2>

    <h4
      [routerLink]="['/categories']"
      class="text-main cursor mb-0 see-all"
    >
      See All
    </h4>
  </div>

  <owl-carousel-o [options]="categoriesOptions">

    <ng-container *ngFor="let category of categories">

      <ng-template carouselSlide [id]="category._id">

        <div class="category-item">
          <img
            class="category-image rounded-5"
            [src]="category.image"
            [alt]="category.name"
            [title]="category.name"
          />

          <p class="text-main pt-2 text-center category-name">
            {{ category.name }}
          </p>
        </div>

      </ng-template>

    </ng-container>

  </owl-carousel-o>

</section>


<!-- Products -->
<section class="products-section px-3 py-4" *ngIf="products.length > 0">

  <h2 class="pb-3">Popular Products</h2>

  <input
    [(ngModel)]="term"
    type="text"
    class="form-control search-input mx-auto mb-4"
    placeholder="Search..."
  />


  <div class="row g-4">

    <div
      class="col-6 col-md-4 col-lg-3 col-xl-2"
      *ngFor="let item of products | search: term | slice : 0 : 18"
    >

      <div class="product">

        <!-- Wishlist -->
        <i
          *ngIf="!wishListData.includes(item._id)"
          (click)="addWishList(item._id)"
          class="fa-regular fa-heart heart"
        ></i>

        <i
          *ngIf="wishListData.includes(item._id)"
          (click)="removeFav(item._id)"
          class="fa-solid fa-heart heart"
        ></i>


        <!-- Product Details -->
        <header
          [routerLink]="['/details', item._id]"
          role="button"
          class="product-header"
        >

          <img
            [src]="item.imageCover"
            [alt]="item.title"
            class="w-100 product-image"
          />

          <h3 class="h6 font-md product-title">
            {{ item.title | cuttext : 2 }}
          </h3>

          <h4 class="font-md text-main product-category">
            {{ item.category.name }}
          </h4>

          <div class="d-flex justify-content-between align-items-center product-info">

            <span class="font-md">
              {{ item.price | currency : "EGP " }}
            </span>

            <p class="mb-0 rating">
              <i class="fas fa-star rading-color"></i>

              <span class="text-muted">
                {{ item.ratingsAverage }}
              </span>
            </p>

          </div>

        </header>


        <!-- Add To Cart -->
        <footer>
          <button
            #element
            (click)="addProduct(item._id, element)"
            class="main-btn w-100"
          >
            + Add To Cart
          </button>
        </footer>

      </div>

    </div>

  </div>

</section>
