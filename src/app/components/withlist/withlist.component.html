 
<section
  class="wishlist-section px-3 py-4"
  *ngIf="products.length > 0"
>

  <h2 class="pb-3">My Wish List</h2>

  <div class="row g-4">

    <div
      class="col-6 col-md-4 col-lg-3 col-xl-2"
      *ngFor="let item of products"
    >

      <div class="product">

        <!-- Wishlist -->
        <i
          *ngIf="!wishListData.includes(item._id)"
          (click)="addWishList(item._id)"
          class="fa-regular fa-heart heart"
        ></i>

        <i
          *ngIf="wishListData.includes(item._id)"
          (click)="removeFav(item._id)"
          class="fa-solid fa-heart heart"
        ></i>


        <!-- Product Details -->
        <header
          [routerLink]="['/details', item._id]"
          role="button"
          class="product-header"
        >

          <img
            [src]="item.imageCover"
            [alt]="item.title"
            class="w-100 product-image"
          />

          <h3 class="h6 font-md product-title">
            {{ item.title | cuttext : 2 }}
          </h3>

          <h4 class="font-md text-main product-category">
            {{ item.category.name }}
          </h4>

          <div
            class="d-flex justify-content-between align-items-center product-info"
          >

            <span class="font-md">
              {{ item.price | currency : "EGP " }}
            </span>

            <p class="mb-0 rating">
              <i class="fas fa-star rading-color"></i>

              <span class="text-muted">
                {{ item.ratingsAverage }}
              </span>
            </p>

          </div>

        </header>


        <!-- Add To Cart -->
        <footer>
          <button
            #element
            (click)="addProduct(item._id, element)"
            class="main-btn w-100"
          >
            + Add To Cart
          </button>
        </footer>

      </div>

    </div>

  </div>

</section>
